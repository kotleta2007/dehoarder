[project]
name = "dehoarder"
version = "0.1.0"
description = "Turn a hoard of open browser tabs into a local book catalogue, semantic graph, and reading plan."
requires-python = ">=3.12,<3.13"
dependencies = [
    "extruct>=0.18.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "polars>=1.44.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.11",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[project.scripts]
dehoarder = "dehoarder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dehoarder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["dehoarder"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
